name: multirtc
channels:
  - conda-forge
  - nodefaults
dependencies:
  # For running
  - python>=3.10
  - pip
  - gdal>=3.0
  - numpy>=1.20
  # isce3 0.22.1 reproduces the official OPERA RTC-S1 products (made with isce3 0.15.0) to 0.005 dB; newer
  # isce3 (0.25) changes gamma0 on steep slopes by tenths of a dB. 0.22 is the oldest isce3 with the
  # point-target functions that multimetric/point_target.py imports.
  - isce3=0.22.1
  - boto3
  - requests
  - lxml
  - shapely
  - pyproj
  - s1reader>=0.2.5
  - sarpy
  - burst2safe
  - tqdm
  - requests
  - urllib3
  # For multimetric
  - matplotlib
  - pandas
  - lmfit
  - scipy
  - scikit-image
  # For packaging, and testing
  - setuptools
  - setuptools_scm
  - wheel
  - pytest
  - pytest-console-scripts
  - pytest-cov
  - ruff
