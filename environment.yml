# Solving this file takes conda about 10 minutes. conda-linux-64.lock lists the exact packages it solved to on
# Linux x86_64 and installs in a few minutes: conda create -n multirtc --file conda-linux-64.lock (see README).
name: multirtc
channels:
  - conda-forge
  - nodefaults
dependencies:
  # For running
  - python>=3.11
  - pip
  - gdal>=3.0
  - numpy>=1.20
  # isce3 0.22.1 reproduces the official OPERA RTC-S1 products (made with isce3 0.15.0) to 0.005 dB; newer
  # isce3 (0.25) changes gamma0 on steep slopes by tenths of a dB. 0.22 is the oldest isce3 with the
  # point-target functions that multimetric/point_target.py imports. The *_cpu build string keeps conda from
  # picking the CUDA build, which needs CUDA libraries and is not used by the RTC.
  - isce3=0.22.1=*_cpu
  - boto3
  - requests
  - lxml
  - shapely
  - pyproj
  - s1reader>=0.2.5
  - sarpy
  - burst2safe
  - tqdm
  - requests
  - urllib3
  # For multimetric
  - matplotlib
  - pandas
  - lmfit
  - scipy
  - scikit-image
  # For packaging, and testing
  - setuptools
  - setuptools_scm
  - wheel
  - pytest
  - pytest-console-scripts
  - pytest-cov
  - ruff
